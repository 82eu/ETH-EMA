<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH EMA 预警系统 · 预警历史</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">

        <!-- 顶部导航 -->
        <div class="header">
            <div class="status-group">
                <div class="status-dot" id="status-dot"></div>
                <span class="status-text" id="status-label">加载中...</span>
            </div>
            <nav class="nav-tabs">
                <a href="/" class="nav-tab">📊 仪表盘</a>
                <a href="/settings" class="nav-tab">⚙️ 设置</a>
                <a href="/history" class="nav-tab active">📜 历史</a>
            </nav>
            <span class="update-time" id="update-time">--:--:--</span>
        </div>

        <!-- 预警统计 -->
        <div class="card">
            <div class="section-title">预警统计</div>
            <div class="config-row">
                <span class="config-label">总记录数</span>
                <span class="config-current" id="total-count">0</span>
            </div>
            <div class="config-row">
                <span class="config-label">开多信号</span>
                <span class="config-current" style="color: #4ade80;" id="buy-count">0</span>
            </div>
            <div class="config-row" style="border-bottom: none;">
                <span class="config-label">开空信号</span>
                <span class="config-current" style="color: #f87171;" id="sell-count">0</span>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="card">
            <div class="section-title">预警记录</div>
            <div class="config-row" style="border-bottom: none; margin-bottom: 14px;">
                <span class="config-label">操作</span>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="loadAlerts()">🔄 刷新列表</button>
                    <button class="btn btn-danger" onclick="clearAlerts()">🗑️ 清空全部</button>
                </div>
            </div>

            <div id="alerts-list">
                <div class="loading-text">暂无预警记录</div>
            </div>
        </div>

    </div>

    <script>
        // ========== 加载预警历史 ==========
        function loadAlerts() {
            fetch('/api/alerts?limit=200')
            .then(r => r.json())
            .then(alerts => {
                var list = document.getElementById('alerts-list');

                // 更新统计
                var total = alerts ? alerts.length : 0;
                var buyCount = alerts ? alerts.filter(a => a.signal === '开多').length : 0;
                var sellCount = alerts ? alerts.filter(a => a.signal === '开空').length : 0;
                document.getElementById('total-count').textContent = total;
                document.getElementById('buy-count').textContent = buyCount;
                document.getElementById('sell-count').textContent = sellCount;

                if (!alerts || alerts.length === 0) {
                    list.innerHTML = '<div class="loading-text">暂无预警记录</div>';
                    return;
                }

                list.innerHTML = alerts.map(a => `
                    <div class="alert-item">
                        <div class="alert-info">
                            <span class="alert-time">${a.time || ''}</span>
                            <span class="alert-signal ${a.signal === '开多' ? 'buy' : a.signal === '开空' ? 'sell' : ''}">
                                ${a.signal || '--'}
                            </span>
                            <span class="alert-price">$${parseFloat(a.price || 0).toFixed(2)}</span>
                            ${a.tf ? `<span style="color: rgba(255,255,255,0.5); font-size: 13px;">[${a.tf}]</span>` : ''}
                        </div>
                        <button class="alert-delete" onclick="deleteAlert(${a.timestamp})">删除</button>
                    </div>
                `).join('');
            })
            .catch(err => {
                console.error('加载预警失败:', err);
                document.getElementById('alerts-list').innerHTML =
                    '<div class="loading-text">加载失败，请刷新页面重试</div>';
            });
        }

        // ========== 删除单条 ==========
        function deleteAlert(timestamp) {
            if (!confirm('确定删除这条预警记录？')) return;
            fetch('/api/delete_alert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ timestamp: timestamp })
            }).then(r => r.json()).then(res => {
                if (res.success) loadAlerts();
                else alert('删除失败: ' + (res.error || '未知错误'));
            }).catch(err => alert('请求失败: ' + err));
        }

        // ========== 清空全部 ==========
        function clearAlerts() {
            if (!confirm('确定清空所有预警记录？此操作不可恢复！')) return;
            fetch('/api/clear_alerts', { method: 'POST' })
            .then(r => r.json()).then(res => {
                if (res.success) loadAlerts();
                else alert('清空失败: ' + (res.error || '未知错误'));
            }).catch(err => alert('请求失败: ' + err));
        }

        // ========== 加载状态指示 ==========
        function loadStatus() {
            fetch('/api/state')
            .then(r => r.json())
            .then(data => {
                var dot = document.getElementById('status-dot');
                var label = document.getElementById('status-label');
                if (data.status && data.status.level === 'online') {
                    dot.className = 'status-dot online';
                    label.textContent = '已连接';
                } else {
                    dot.className = 'status-dot offline';
                    label.textContent = '离线';
                }
                if (data.update_time_str) {
                    document.getElementById('update-time').textContent =
                        data.update_time_str.split(' ')[1] || data.update_time_str;
                }
            });
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadStatus();
            loadAlerts();
            // 每30秒刷新一次状态
            setInterval(loadStatus, 30000);
        });
    </script>
</body>
</html>
