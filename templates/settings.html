<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH EMA 预警系统 · 系统设置</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">

        <!-- 顶部导航 -->
        <div class="header">
            <div class="status-group">
                <div class="status-dot" id="status-dot"></div>
                <span class="status-text" id="status-label">加载中...</span>
            </div>
            <nav class="nav-tabs">
                <a href="/" class="nav-tab">📊 仪表盘</a>
                <a href="/settings" class="nav-tab active">⚙️ 设置</a>
                <a href="/history" class="nav-tab">📜 历史</a>
            </nav>
            <span class="update-time" id="update-time">--:--:--</span>
        </div>

        <!-- 系统设置 -->
        <div class="card">
            <div class="section-title">飞书机器人</div>
            <div class="config-row">
                <span class="config-label">当前状态</span>
                <span class="config-current" id="feishu-status">未配置</span>
            </div>
            <div class="config-row">
                <span class="config-label">Webhook 地址</span>
                <input type="text" id="feishu-webhook" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/..." style="flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: inherit; font-size: 13px;">
            </div>
            <div class="config-row" style="border-bottom: none;">
                <span class="config-label">测试推送</span>
                <button class="btn btn-primary" onclick="testAlert()">发送测试消息</button>
            </div>
        </div>

        <!-- EMA 参数 -->
        <div class="card">
            <div class="section-title">EMA 参数</div>
            <div class="config-row">
                <span class="config-label">EMA 短周期</span>
                <input type="number" id="ema-short" value="180" min="5" max="1000" style="width: 120px; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px;">
            </div>
            <div class="config-row" style="border-bottom: none;">
                <span class="config-label">EMA 长周期</span>
                <input type="number" id="ema-long" value="250" min="10" max="2000" style="width: 120px; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px;">
            </div>
        </div>

        <!-- 推送设置 -->
        <div class="card">
            <div class="section-title">推送设置</div>
            <div class="config-row">
                <span class="config-label">推送间隔</span>
                <span class="config-current" id="current-interval">每4小时</span>
            </div>
            <div class="config-row">
                <span class="config-label">修改间隔</span>
                <select id="interval-select" style="flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; cursor: pointer;">
                    <option value="30">30秒</option>
                    <option value="60">1分钟</option>
                    <option value="300">5分钟</option>
                    <option value="600">10分钟</option>
                    <option value="1800">30分钟</option>
                    <option value="3600">1小时</option>
                    <option value="7200">2小时</option>
                    <option value="14400">4小时</option>
                    <option value="28800">8小时</option>
                    <option value="43200">12小时</option>
                </select>
            </div>
            <div class="config-row" style="border-bottom: none;">
                <span class="config-label">预警冷却</span>
                <input type="number" id="cooldown-seconds" value="600" min="60" max="86400" style="width: 120px; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px;">
                <span style="color: rgba(255,255,255,0.5); font-size: 13px;">秒</span>
            </div>
        </div>

        <!-- 周期预警开关 -->
        <div class="card">
            <div class="section-title">启用预警周期</div>
            <div class="config-row" style="flex-wrap: wrap; gap: 14px; border-bottom: none;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="tf-5m-enabled" class="tf-switch" data-tf="5m">
                    <span>5分钟</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="tf-15m-enabled" class="tf-switch" data-tf="15m">
                    <span>15分钟</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="tf-30m-enabled" class="tf-switch" data-tf="30m">
                    <span>30分钟</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="tf-1h-enabled" class="tf-switch" data-tf="1h">
                    <span>1小时</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="tf-4h-enabled" class="tf-switch" data-tf="4h">
                    <span>4小时</span>
                </label>
            </div>
        </div>

        <!-- 保存按钮 -->
        <div class="card">
            <div class="section-title">保存设置</div>
            <div class="config-row" style="border-bottom: none;">
                <span class="config-label">操作</span>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="saveAllConfig()">💾 保存全部设置</button>
                    <button class="btn" onclick="refreshData()">🔄 刷新数据</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ========== 填充配置 ==========
        function populateConfigFields(cfg) {
            if (!cfg) return;

            var feishuCfg = cfg.feishu || {};
            var webhook = feishuCfg.webhook || '';
            var webhookInput = document.getElementById('feishu-webhook');
            if (webhookInput) webhookInput.value = webhook;

            var fsStatus = document.getElementById('feishu-status');
            if (fsStatus) fsStatus.textContent = webhook ? '✅ 已配置' : '⚠️ 未配置';

            var emaCfg = cfg.ema_alert || {};
            var es = document.getElementById('ema-short');
            var el = document.getElementById('ema-long');
            if (es) es.value = emaCfg.ema_short || 180;
            if (el) el.value = emaCfg.ema_long || 250;

            var interval = feishuCfg.price_push_interval_seconds || 14400;
            var intervalSelect = document.getElementById('interval-select');
            if (intervalSelect) intervalSelect.value = interval;
            var curInterval = document.getElementById('current-interval');
            if (curInterval) {
                var displayText = '';
                for (var i = 0; i < intervalSelect.options.length; i++) {
                    if (intervalSelect.options[i].value == interval) {
                        displayText = intervalSelect.options[i].text;
                        break;
                    }
                }
                curInterval.textContent = '每' + (displayText || '4小时');
            }

            var alertCfg = cfg.alert || {};
            var cooldown = document.getElementById('cooldown-seconds');
            if (cooldown) cooldown.value = alertCfg.cooldown_seconds || 600;

            var enabledTfs = emaCfg.enabled_timeframes || [];
            ['5m', '15m', '30m', '1h', '4h'].forEach(function(tf) {
                var cb = document.getElementById('tf-' + tf + '-enabled');
                if (cb) cb.checked = enabledTfs.indexOf(tf) >= 0;
            });
        }

        // ========== 保存全部设置 ==========
        function saveAllConfig() {
            var webhook = document.getElementById('feishu-webhook').value.trim();
            var emaShort = parseInt(document.getElementById('ema-short').value) || 180;
            var emaLong = parseInt(document.getElementById('ema-long').value) || 250;
            var interval = parseInt(document.getElementById('interval-select').value) || 14400;
            var cooldown = parseInt(document.getElementById('cooldown-seconds').value) || 600;

            if (emaShort >= emaLong) {
                alert('EMA 短周期必须小于长周期');
                return;
            }

            var enabledTfs = [];
            document.querySelectorAll('.tf-switch').forEach(function(cb) {
                if (cb.checked) enabledTfs.push(cb.dataset.tf);
            });

            var payload = {
                feishu_webhook: webhook,
                ema_short: emaShort,
                ema_long: emaLong,
                push_interval: interval,
                cooldown_seconds: cooldown,
                enabled_timeframes: enabledTfs
            };

            fetch('/api/save_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    alert('✅ 设置保存成功！已生效');
                    loadConfig();
                } else {
                    alert('保存失败: ' + (res.error || '未知错误'));
                }
            })
            .catch(err => alert('请求失败: ' + err));
        }

        // ========== 加载配置 ==========
        function loadConfig() {
            fetch('/api/state')
            .then(r => r.json())
            .then(data => {
                if (data.status) {
                    var dot = document.getElementById('status-dot');
                    var label = document.getElementById('status-label');
                    if (data.status.level === 'online') {
                        dot.className = 'status-dot online';
                        label.textContent = '已连接';
                    } else {
                        dot.className = 'status-dot offline';
                        label.textContent = '离线';
                    }
                }
                if (data.update_time_str) {
                    document.getElementById('update-time').textContent =
                        data.update_time_str.split(' ')[1] || data.update_time_str;
                }
                if (data.config) populateConfigFields(data.config);
            })
            .catch(err => console.error('加载配置失败:', err));
        }

        // ========== 刷新数据 ==========
        function refreshData() {
            fetch('/api/refresh_data')
            .then(r => r.json())
            .then(res => {
                if (res.success) alert('数据刷新完成');
                else alert('刷新失败: ' + (res.error || '未知错误'));
            })
            .catch(err => alert('请求失败: ' + err));
        }

        // ========== 测试推送 ==========
        function testAlert() {
            fetch('/api/test_alert', { method: 'POST' })
            .then(r => r.json())
            .then(res => {
                if (res.success) alert('✅ 测试预警已发送到飞书');
                else alert('发送失败：' + (res.error || '未知错误'));
            })
            .catch(err => alert('请求失败: ' + err));
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadConfig();
        });
    </script>
</body>
</html>
