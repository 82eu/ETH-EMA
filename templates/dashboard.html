<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH EMA 预警系统 · 仪表盘</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">

        <!-- 顶部导航 -->
        <div class="header">
            <div class="status-group">
                <div class="status-dot" id="status-dot"></div>
                <span class="status-text" id="status-label">加载中...</span>
            </div>
            <nav class="nav-tabs">
                <a href="/" class="nav-tab active">📊 仪表盘</a>
                <a href="/settings" class="nav-tab">⚙️ 设置</a>
                <a href="/history" class="nav-tab">📜 历史</a>
            </nav>
            <span class="update-time" id="update-time">--:--:--</span>
        </div>

        <!-- 价格卡片 -->
        <div class="price-card">
            <div class="price-label">ETH / USDT 实时价格</div>
            <div class="price-value" id="current-price">正在加载...</div>
            <div class="price-info" id="price-info">EMA 180 · EMA 250 · 更新中</div>
        </div>

        <!-- 信息栏 -->
        <div class="info-bar">
            <span>状态: <span id="conn-status">连接中...</span></span>
            <span>下次刷新: <span class="refresh-countdown" id="refresh-countdown">30</span>秒</span>
            <span class="source-detail" id="source-detail">数据源详情 ›</span>
        </div>

        <!-- 各周期状态 -->
        <div class="card">
            <div class="section-title">各周期状态</div>
            <div class="tf-tabs" id="tf-tabs">
                <div class="tf-tab" data-tf="5m">
                    <div class="tf-label">5分钟</div>
                    <div class="signal" id="tf-5m-signal">--</div>
                </div>
                <div class="tf-tab" data-tf="15m">
                    <div class="tf-label">15分钟</div>
                    <div class="signal" id="tf-15m-signal">--</div>
                </div>
                <div class="tf-tab" data-tf="30m">
                    <div class="tf-label">30分钟</div>
                    <div class="signal" id="tf-30m-signal">--</div>
                </div>
                <div class="tf-tab" data-tf="1h">
                    <div class="tf-label">1小时</div>
                    <div class="signal" id="tf-1h-signal">--</div>
                </div>
                <div class="tf-tab" data-tf="4h">
                    <div class="tf-label">4小时</div>
                    <div class="signal" id="tf-4h-signal">--</div>
                </div>
            </div>

            <div class="ema-card">
                <div class="ema-item">
                    <div class="ema-label">EMA 180</div>
                    <div class="ema-value short" id="ema-short">$0.00</div>
                </div>
                <div class="ema-item">
                    <div class="ema-label">EMA 250</div>
                    <div class="ema-value long" id="ema-long">$0.00</div>
                </div>
            </div>

            <div class="detail-row">
                <span class="detail-label">均线排列</span>
                <span class="detail-value" id="arrangement">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">价格状态</span>
                <span class="detail-value" id="position">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">更新时间</span>
                <span class="detail-value" id="tf-update-time">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">数据源</span>
                <span class="detail-value" id="data-source">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">预警信号</span>
                <span class="detail-value" id="alert-status">--</span>
            </div>
        </div>

        <!-- 价格区间预警 -->
        <div class="card">
            <div class="section-title">价格区间预警</div>
            <div class="config-row" style="border-bottom: none; margin-bottom: 12px;">
                <span class="config-label">设置价格触发区间</span>
                <button class="btn btn-primary" onclick="showAddRangeModal()">+ 添加区间</button>
            </div>
            <div id="price-ranges-list">
                <div class="loading-text">暂无价格区间，点击上方按钮添加</div>
            </div>
        </div>

        <!-- 快速操作 -->
        <div class="card">
            <div class="section-title">快速操作</div>
            <div class="config-row" style="border-bottom: none;">
                <span class="config-label">测试推送</span>
                <button class="btn btn-primary" onclick="testAlert()">发送测试预警</button>
            </div>
            <div class="config-row" style="border-bottom: none;">
                <span class="config-label">立即刷新</span>
                <button class="btn" onclick="refreshData()">刷新数据</button>
            </div>
        </div>

    </div>

    <!-- 添加价格区间模态框 -->
    <div class="modal-overlay" id="add-range-modal">
        <div class="modal">
            <h3>添加价格区间</h3>
            <input type="text" id="range-name" placeholder="区间名称（可选）">
            <input type="number" id="range-low" placeholder="下限价格，如 1600">
            <input type="number" id="range-high" placeholder="上限价格，如 1700">
            <div class="modal-buttons">
                <button class="btn" onclick="closeAddRangeModal()">取消</button>
                <button class="btn btn-primary" onclick="addPriceRange()">添加</button>
            </div>
        </div>
    </div>

    <!-- 数据源详情模态框 -->
    <div class="modal-overlay" id="sources-modal">
        <div class="modal">
            <h3>数据源状态</h3>
            <div id="sources-content" style="max-height: 300px; overflow-y: auto;"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="closeSourcesModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 全局状态 ==========
        var _selectedTF = '15m';
        var _countdown = 30;
        var _lastPrice = 0;
        var _priceFlashTimer = null;

        // ========== 倒计时 ==========
        function updateCountdown() {
            var el = document.getElementById('refresh-countdown');
            if (el) el.textContent = _countdown;
        }

        // ========== 刷新数据 ==========
        function refreshData() {
            fetch('/api/refresh_data')
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    loadState();
                    alert('数据刷新完成');
                } else {
                    alert('刷新失败: ' + (res.error || '未知错误'));
                }
            }).catch(err => alert('请求失败: ' + err));
        }

        // ========== 测试预警 ==========
        function testAlert() {
            fetch('/api/test_alert', { method: 'POST' })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    alert('测试预警已发送到飞书');
                } else {
                    alert('发送失败：' + (res.error || '未知错误'));
                }
            }).catch(err => alert('请求失败: ' + err));
        }

        // ========== 加载系统状态 ==========
        function loadState() {
            _countdown = 30;
            updateCountdown();

            fetch('/api/state')
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    console.error('加载状态失败:', data.error);
                    return;
                }

                // 更新连接状态
                if (data.status) updateStatus(data.status);

                // 更新时间
                if (data.update_time_str) {
                    document.getElementById('update-time').textContent =
                        data.update_time_str.split(' ')[1] || data.update_time_str;
                }

                // 更新价格
                if (data.latest_price) updatePrice(data.latest_price);

                // 更新各周期状态
                if (data.states) {
                    updateTFStates(data.states);
                    updateCurrentTFDetail(data.states);
                }

                // 加载价格区间
                loadPriceRanges(data.price_ranges);
            })
            .catch(err => console.error('加载状态失败:', err));
        }

        // ========== 更新状态指示 ==========
        function updateStatus(status) {
            var dot = document.getElementById('status-dot');
            var label = document.getElementById('status-label');
            var conn = document.getElementById('conn-status');

            if (status.level === 'online') {
                dot.className = 'status-dot online';
                label.textContent = '已连接';
                conn.textContent = status.detail || '交易所连接正常';
                conn.style.color = '#4ade80';
            } else {
                dot.className = 'status-dot offline';
                label.textContent = '离线';
                conn.textContent = status.detail || '连接异常';
                conn.style.color = '#f87171';
            }

            document.getElementById('source-detail').onclick = function() {
                fetch('/api/state')
                .then(r => r.json())
                .then(data => {
                    if (data.source_health) showSourcesModal(data.source_health);
                });
            };
        }

        // ========== 价格更新 + 变色动画 ==========
        function updatePrice(price) {
            var el = document.getElementById('current-price');
            var priceNum = parseFloat(price);

            if (!isNaN(priceNum) && priceNum > 0) {
                var newVal = '$' + priceNum.toLocaleString('en-US', {
                    minimumFractionDigits: 2, maximumFractionDigits: 2
                });

                if (_lastPrice === 0) {
                    el.textContent = newVal;
                    el.style.color = '#fff';
                    _lastPrice = priceNum;
                    return;
                }

                if (el.textContent !== newVal) {
                    if (_priceFlashTimer) { clearTimeout(_priceFlashTimer); _priceFlashTimer = null; }
                    el.style.color = priceNum > _lastPrice ? '#4ade80' : '#f87171';
                    el.textContent = newVal;
                    _lastPrice = priceNum;
                    _priceFlashTimer = setTimeout(function() {
                        el.style.color = '#fff';
                        _priceFlashTimer = null;
                    }, 3000);
                }
            }
        }

        // ========== 周期信号更新 ==========
        function updateTFStates(states) {
            ['5m', '15m', '30m', '1h', '4h'].forEach(tf => {
                var state = states[tf];
                var signalEl = document.getElementById('tf-' + tf + '-signal');
                var tabEl = document.querySelector('.tf-tab[data-tf="' + tf + '"]');

                if (state && signalEl) {
                    signalEl.textContent = state.signal_text || '观望';
                    signalEl.className = 'signal';
                    if (state.signal === '开多') signalEl.classList.add('buy');
                    else if (state.signal === '开空') signalEl.classList.add('sell');
                }

                if (tabEl) tabEl.onclick = function() { selectTF(tf); };
            });
        }

        function selectTF(tf) {
            _selectedTF = tf;
            document.querySelectorAll('.tf-tab').forEach(el => el.classList.remove('active'));
            document.querySelector('.tf-tab[data-tf="' + tf + '"]')?.classList.add('active');
            fetch('/api/state')
            .then(r => r.json())
            .then(data => { if (data.states) updateCurrentTFDetail(data.states); });
        }

        function updateCurrentTFDetail(states) {
            var state = states[_selectedTF];
            if (!state) return;

            document.getElementById('ema-short').textContent = '$' +
                (state.ema_short ? state.ema_short.toFixed(2) : '0.00');
            document.getElementById('ema-long').textContent = '$' +
                (state.ema_long ? state.ema_long.toFixed(2) : '0.00');
            document.getElementById('tf-update-time').textContent = state.update_time || '--';
            document.getElementById('data-source').textContent = state.data_source || '--';

            var arrEl = document.getElementById('arrangement');
            arrEl.textContent = state.arrangement_text || '多头排列';
            arrEl.className = 'detail-value ' + (state.arrangement === 'bull' ? 'bull' : 'bear');

            var posEl = document.getElementById('position');
            posEl.textContent = state.position_text || '区间外';
            posEl.className = 'detail-value ' + (state.in_zone ? 'in-zone' : '');

            var alertEl = document.getElementById('alert-status');
            if (state.in_zone) {
                alertEl.textContent = state.signal === '开多' ? '🟢 开多信号' : '🔴 开空信号';
                alertEl.className = 'detail-value ' + (state.signal === '开多' ? 'bull' : 'bear');
            } else {
                alertEl.textContent = '⚪ 观望';
                alertEl.className = 'detail-value';
            }

            if (state.price) {
                document.getElementById('price-info').textContent =
                    'EMA 180 · EMA 250 · 更新于 ' + (state.update_time || '--:--:--');
            }
        }

        // ========== 价格区间 ==========
        function loadPriceRanges(ranges) {
            var list = document.getElementById('price-ranges-list');
            if (!ranges || ranges.length === 0) {
                list.innerHTML = '<div class="loading-text">暂无价格区间，点击上方按钮添加</div>';
                return;
            }
            list.innerHTML = ranges.map((r, idx) => `
                <div class="price-range-item ${r.enabled ? '' : 'disabled'}">
                    <div>
                        <span class="price-range-name">${r.name || '区间' + (idx+1)}</span>
                        <span class="price-range-values">$${parseFloat(r.low).toFixed(2)} - $${parseFloat(r.high).toFixed(2)}</span>
                    </div>
                    <div class="action-group">
                        <div class="price-range-toggle ${r.enabled ? 'active' : ''}"
                             onclick="togglePriceRange(${idx})"></div>
                        <button class="alert-delete" onclick="deletePriceRange(${idx})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function showAddRangeModal() {
            document.getElementById('add-range-modal').classList.add('active');
        }
        function closeAddRangeModal() {
            document.getElementById('add-range-modal').classList.remove('active');
            document.getElementById('range-name').value = '';
            document.getElementById('range-low').value = '';
            document.getElementById('range-high').value = '';
        }

        function addPriceRange() {
            var name = document.getElementById('range-name').value;
            var low = parseFloat(document.getElementById('range-low').value);
            var high = parseFloat(document.getElementById('range-high').value);
            if (isNaN(low) || isNaN(high) || low <= 0 || high <= 0 || low >= high) {
                alert('请输入有效的价格范围');
                return;
            }
            fetch('/api/add_price_range', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, low: low, high: high })
            }).then(r => r.json()).then(res => {
                if (res.success) {
                    closeAddRangeModal();
                    fetch('/api/state').then(r => r.json())
                        .then(data => loadPriceRanges(data.price_ranges));
                    alert('价格区间添加成功');
                } else {
                    alert('添加失败: ' + (res.error || '未知错误'));
                }
            }).catch(err => alert('请求失败: ' + err));
        }

        function togglePriceRange(index) {
            fetch('/api/toggle_price_range', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index: index })
            }).then(r => r.json()).then(res => {
                if (res.success) {
                    fetch('/api/state').then(r => r.json())
                        .then(data => loadPriceRanges(data.price_ranges));
                } else {
                    alert('操作失败: ' + (res.error || '未知错误'));
                }
            }).catch(err => alert('请求失败: ' + err));
        }

        function deletePriceRange(index) {
            if (!confirm('确定删除这个价格区间？')) return;
            fetch('/api/delete_price_range', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index: index })
            }).then(r => r.json()).then(res => {
                if (res.success) {
                    fetch('/api/state').then(r => r.json())
                        .then(data => loadPriceRanges(data.price_ranges));
                } else {
                    alert('删除失败: ' + (res.error || '未知错误'));
                }
            }).catch(err => alert('请求失败: ' + err));
        }

        // ========== 数据源模态框 ==========
        function showSourcesModal(health) {
            var content = document.getElementById('sources-content');
            content.innerHTML = Object.entries(health).map(([name, h]) => `
                <div style="padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <div style="font-weight: 600; margin-bottom: 6px;">${name}</div>
                    <div style="font-size: 13px; color: ${h.status === 'ok' ? '#4ade80' : '#f87171'}; margin-bottom: 4px;">
                        ${h.status === 'ok' ? '✅ 正常运行' : '❌ 异常'}
                    </div>
                    ${h.error ? `<div style="font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px;">${h.error}</div>` : ''}
                </div>
            `).join('');
            document.getElementById('sources-modal').classList.add('active');
        }
        function closeSourcesModal() {
            document.getElementById('sources-modal').classList.remove('active');
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.tf-tab[data-tf="' + _selectedTF + '"]')?.classList.add('active');
            loadState();

            (function startRefreshLoop() {
                loadState();
                setTimeout(arguments.callee, 30000);
            })();

            setInterval(function() {
                _countdown--;
                if (_countdown < 1) _countdown = 30;
                updateCountdown();
            }, 1000);
        });
    </script>
</body>
</html>
